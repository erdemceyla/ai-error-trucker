<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>AI Hata Takibi Test</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f4f9; padding-top: 100px; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #ff4757; color: white; border: none; border-radius: 8px; transition: 0.3s; }
        button:hover { background: #ff6b81; transform: scale(1.05); }
        #result { margin-top: 20px; padding: 15px; color: #2f3542; line-height: 1.6; text-align: left; max-width: 500px; border-left: 5px solid #1e90ff; display: none; background: #e1f5fe; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚨 Hata Takip Testi</h1>
        <p>Butona bastığında sistem kasten bir hata üretecek.</p>
        <button id="failBtn">Hatayı Tetikle</button>
        <div id="result">
            <strong>🤖 AI Analizi Yükleniyor...</strong>
            <p id="aiText"></p>
        </div>
    </div>

    <script>
        const resultDiv = document.getElementById('result');
        const aiText = document.getElementById('aiText');

        // 1. GLOBAL HATA YAKALAYICI
        window.onerror = function (msg, url, line) {
            resultDiv.style.display = 'block';
            aiText.innerText = "Hata yakalandı, AI'ya gönderiliyor...";

            // FastAPI Backend'ine gönder
            fetch('http://127.0.0.1:8000/log-error', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    source: "frontend_test_page",
                    message: msg,
                    stack: "Satır: " + line + " | URL: " + url
                })
            })
            .then(res => res.json())
            .then(data => {
                aiText.innerText = data.ai_analysis;
            })
            .catch(err => {
                aiText.innerText = "Backend'e ulaşılamadı. Sunucun açık mı?";
            });
        };

        // 2. KASTEN HATA ÇIKARTAN BUTON
        document.getElementById('failBtn').onclick = function() {
            // Bilerek tanımlanmamış bir fonksiyon çağırıyoruz
            analizEtBakaliim(); 
        };
    </script>
</body>
</html>
